name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  trusted_head:
    name: Trusted head admission
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Reject external fork execution
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "pull_request" ] && [ "${HEAD_REPOSITORY}" != "${BASE_REPOSITORY}" ]; then
            echo "External fork pull requests cannot be merged until a maintainer moves the reviewed commit to a repository-owned branch." >&2
            exit 1
          fi

  build-test:
    needs: trusted_head
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    # Pull requests run on GitHub-hosted capacity.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/package-ci

  build-test-main:
    needs: trusted_head
    if: ${{ github.event_name != 'pull_request' }}
    # Match the approved Schema runner selection for trusted main validation.
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["self-hosted","Linux","X64"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/package-ci
